<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plotly Chart</title>
  <!-- Include Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <!-- Chart container -->
  <div id="myPlot" style="width: 100%; height: 500px;"></div>

  <script>
    // Sample Plotly chart
    var data = [{
      x: [1, 2, 3, 4],
      y: [10, 15, 13, 17],
      type: 'scatter'
    }];

    Plotly.newPlot('myPlot', data);
  </script>
</body>
</html>
